<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found (404) | Kaye Gamana</title>
  <meta name="description" content="This page doesn't exist or may have moved. Head back to Kaye Gamana's portfolio.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#00011e">
  <link rel="icon" href="/assets/img/logo.ico" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Absolute paths on purpose: GitHub Pages serves this file for any
       missing URL, including deep ones like /foo/bar/baz -->
  <link rel="stylesheet" href="/css/style.css">

  <style>
    /* Navbar, content and footer fill the screen exactly, so the footer
       sits at the bottom and the page only scrolls if the screen is
       genuinely too short (e.g. a phone in landscape). */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .notfound {
      flex: 1;
      display: flex;
      align-items: center;
      padding: clamp(20px, 6vh, 72px) var(--section-gutter);
      background: radial-gradient(circle at 50% 40%, #040740 0%, #010226 70%);
    }

    .notfound__inner {
      width: 100%;
      max-width: 720px;
      margin-inline: auto;
      text-align: center;
    }

    /* Sized by width and height, so it never pushes the footer off screen */
    .notfound__code {
      color: var(--accent);
      font-family: var(--font-heading);
      font-size: clamp(72px, min(26vw, 24vh), 240px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.9;
      text-shadow: 6px 6px 0 var(--blue-shadow);
      animation: notfound-float 6s ease-in-out infinite;
    }

    @keyframes notfound-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .notfound__title {
      margin: clamp(16px, 3.5vh, 32px) 0 12px;
      font-family: var(--font-heading);
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-wrap: balance;
    }

    .notfound__error {
      color: var(--accent-light);
    }

    .notfound__text {
      max-width: 46ch;
      margin: 0 auto clamp(24px, 4.5vh, 40px);
      color: var(--text-soft);
      font-size: clamp(16px, 1.6vw, 19px);
      line-height: 1.55;
      text-wrap: pretty;
    }

    .notfound__actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px 20px;
    }

    /* Outline button: the 404 above is already solid and heavy, so this stays
       light. A thick border, a faint tint and the hard shadow keep it the
       obvious next step. It fills in on hover and focus. */
    .notfound__button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      padding: 14px 32px;
      border: 3px solid var(--accent);
      border-radius: 99px;
      background: rgba(90, 157, 217, 0.1);
      color: var(--text);
      box-shadow: 5px 5px 0 var(--blue-shadow);
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .notfound__button i {
      color: var(--accent-light);
      font-size: 17px;
      transition: color 0.2s ease;
    }

    .notfound__button:hover,
    .notfound__button:focus-visible {
      background: var(--accent);
      color: var(--navy-900);
      box-shadow: 7px 7px 0 var(--blue-shadow);
      transform: translate(-2px, -2px);
    }

    .notfound__button:hover i,
    .notfound__button:focus-visible i {
      color: var(--navy-900);
    }

    .notfound__button:active {
      box-shadow: 2px 2px 0 var(--blue-shadow);
      transform: translate(2px, 2px);
    }

    .notfound__back {
      padding: 8px 4px;
      border: 0;
      border-bottom: 2px solid var(--accent);
      background: none;
      color: var(--accent-light);
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .notfound__back:hover {
      color: var(--text);
    }

    /* Shown by the script below only when there is a page to go back to */
    .notfound__back[hidden] {
      display: none;
    }

    /* Phones */
    @media (max-width: 600px) {
      .notfound__code {
        text-shadow: 4px 4px 0 var(--blue-shadow);
      }

      .notfound__button {
        box-shadow: 4px 4px 0 var(--blue-shadow);
      }
    }

    /* Very narrow phones (320px): full-width button, easy to tap */
    @media (max-width: 380px) {
      .notfound__actions {
        flex-direction: column;
        gap: 14px;
      }

      .notfound__button {
        width: 100%;
        padding-inline: 20px;
      }
    }

    /* Short screens such as phones in landscape: tighten spacing so
       as much as possible fits before the page has to scroll */
    @media (max-height: 520px) {
      .notfound {
        padding-block: 16px;
      }

      .notfound__code {
        font-size: clamp(64px, 22vh, 120px);
      }

      .notfound__title {
        margin-top: 10px;
        margin-bottom: 8px;
      }

      .notfound__text {
        margin-bottom: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Same navbar as the main page. Links start with "/" so they work
       from any URL, and the markup is shared with index.html. -->
  <header class="navbar" id="navbar">
    <div class="container navbar__inner">
      <a class="navbar__brand" href="/#home">
        <img src="/assets/img/logo.webp" alt="Kaye Gamana logo">
      </a>

      <button class="navbar__toggler" id="nav-toggler" type="button"
              aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-menu">
        <span class="navbar__bar"></span>
        <span class="navbar__bar"></span>
        <span class="navbar__bar"></span>
      </button>

      <nav class="navbar__menu" id="nav-menu" aria-label="Main navigation">
        <div class="navbar__menu-inner">
          <ul class="navbar__links">
            <li><a class="navbar__link" href="/#home">Home</a></li>
            <li><a class="navbar__link" href="/#about">About</a></li>
            <li><a class="navbar__link" href="/#experience">Experience</a></li>
            <li><a class="navbar__link" href="/#projects">Projects</a></li>
            <li><a class="navbar__link" href="/#stack">Stack</a></li>
          </ul>
          <a class="navbar__cta" href="/#contact">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="notfound">
    <div class="notfound__inner">

      <p class="notfound__code" aria-hidden="true">404</p>

      <h1 class="notfound__title"><span class="notfound__error">Error 404:</span> Page Not Found</h1>
      <p class="notfound__text">The page you're looking for doesn't exist or may have moved. Check the address, or head back to the portfolio.</p>

      <div class="notfound__actions">
        <a class="notfound__button" href="/">
          <i class="bi bi-house-fill" aria-hidden="true"></i>
          <span>Back to Home</span>
        </a>
        <button class="notfound__back" id="go-back" type="button" hidden>Go back</button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span>© 2026 Kaye Christine P. Gamana</span>
      <span class="footer__tagline">Design • Code • Data • QA • Security</span>
      <span class="footer__social">
        <a href="mailto:kayecgamana@gmail.com" aria-label="Email"><i class="bi bi-envelope-fill"></i></a>
        <a href="https://www.linkedin.com/in/kaye-gamana" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
        <a href="https://github.com/kayegamana" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="bi bi-github"></i></a>
      </span>
    </div>
  </footer>

  <script>
    // "Go back" only appears when there is history to go back to.
    // Without JavaScript it stays hidden and "Back to Home" still works.
    (function () {
      var button = document.getElementById("go-back");
      if (!button || window.history.length < 2) return;

      button.hidden = false;
      button.addEventListener("click", function () {
        window.history.back();
      });
    })();
  </script>

  <!-- Shared site script: powers the navbar (mobile menu, hide on scroll).
       Every other init in it exits quietly when its section isn't on the page. -->
  <script src="/js/script.js" defer></script>
</body>
</html>
